# Ominty AI configuration — portable default.
#
# AI is configured at the END of setup, by scripts/setup-ai.sh, after the
# desktop itself has been verified. Until then the default is "none", so no AI
# action claims a provider that is not installed.
#
# User configuration wins over the shipped template; install.sh only writes
# this file when it does not exist.

[ai]
default_provider = "none"

[ai.providers.pi]
enabled = true

[ai.providers.ollama]
enabled = true
model = "qwen2.5:3b"
