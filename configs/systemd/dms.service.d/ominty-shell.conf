# Ominty DMS shell fork (motion + accent glow).
#
# Delivered as a drop-in so it works with both delivery models:
#   - Debian/LMDE: the dms package ships dms.service; we must not replace it.
#   - Ubuntu source build: install.sh writes the unit, and this drop-in adds
#     the same environment line.
#
# The install path below is rebased onto the user's home by install.sh.
[Service]
Environment=DMS_SHELL_DIR=__HOME__/.local/share/dms-shell
