# Ominty DMS shell fork (motion + accent glow).
#
# Delivered as a drop-in so it layers on whichever unit is in effect:
#   - Debian/LMDE: overrides the packaged /usr/lib/systemd/user/dms.service.
#   - Ubuntu/any source build: layers on the unit install.sh writes.
#
# The install path below is rebased onto the user's home by install.sh.
[Service]
Environment=DMS_SHELL_DIR=__HOME__/.local/share/dms-shell
